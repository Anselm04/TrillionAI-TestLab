name: Resolve Testkube security dependency candidate
on:
  push:
    branches: [feat/testkube-mit-qualification]
    paths: ['.github/workflows/testkube-security-locks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/feat/testkube-mit-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Resolve pinned remediation versions in disposable checkout
        working-directory: third_party/testkube
        run: |
          set -euo pipefail
          go get \
            github.com/andybalholm/brotli@v1.2.7 \
            github.com/cloudevents/sdk-go/v2@v2.15.2 \
            github.com/gofiber/fiber/v2@v2.52.13 \
            github.com/gorilla/websocket@v1.5.1 \
            github.com/klauspost/compress@v1.20.2 \
            github.com/valyala/fasthttp@v1.70.0 \
            github.com/vektah/gqlparser/v2@v2.5.14 \
            go.mongodb.org/mongo-driver@v1.17.7 \
            golang.org/x/crypto@v0.55.0 \
            golang.org/x/net@v0.62.0 \
            golang.org/x/text@v0.41.0 \
            golang.org/x/mod@v0.40.0 \
            golang.org/x/oauth2@v0.27.0 \
            google.golang.org/grpc@v1.83.2 \
            google.golang.org/protobuf@v1.33.0
          go mod tidy
          go mod verify
          go list -mod=readonly -m all > "$RUNNER_TEMP/testkube-candidate-modules.txt"
      - name: Verify candidate builds and deadline regression
        working-directory: third_party/testkube
        run: |
          set -euo pipefail
          go test -mod=readonly ./pkg/executor/containerexecutor -run '^TestConfirmJobDeadline$' -count=1
          go build -mod=readonly -o "$RUNNER_TEMP/testkube-api" ./cmd/api-server
          for component in init scraper; do
            CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$RUNNER_TEMP/$component-runner" "./contrib/executor/$component/cmd/agent"
          done
          git diff -- go.mod go.sum > "$RUNNER_TEMP/testkube-dependency-candidate.diff"
      - name: Upload candidate lockfiles for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: testkube-security-lock-candidate
          path: |
            third_party/testkube/go.mod
            third_party/testkube/go.sum
            ${{ runner.temp }}/testkube-candidate-modules.txt
            ${{ runner.temp }}/testkube-dependency-candidate.diff
          if-no-files-found: error
