name: Embed pinned Testkube reference
on:
  push:
    branches: [feat/testkube-foundation]
    paths: ['.github/workflows/import-testkube-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    if: github.ref == 'refs/heads/feat/testkube-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Embed exact reference Git tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/Anselm04/Testkube-Source-Code-Reference.git 51697966d39ee714c7e5ef9d6dadb8fd92f2b444
          source_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          test "$source_tree" = 8942aa04d5e18a13dc8cd8a5a4f9c682af78d434
          test ! -e third_party/testkube
          git read-tree --prefix=third_party/testkube/ -u "$source_tree"
          result="$(git write-tree)"
          test "$(git rev-parse "$result:third_party/testkube")" = "$source_tree"
          git diff --cached --name-only | awk '!/^third_party\/testkube\// {exit 1}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Embed pinned Testkube reference source with exact tree verification'
          git push origin HEAD:refs/heads/feat/testkube-foundation
          echo "Embedded tree: $source_tree"
